    <style>
      :root {
        --bg-street: #151525;
        --bg-sky: #0a0a15;
        --building: #101020;
        --window-lit: #1a1a3a;
        --window-dark: #0a0a1a;
        --street-light: #ffaa00;
        --market-sign: #ff3333;
        --market-sign-dim: #cc2222;
        --zombie-skin: #7a5a4a;
        --zombie-skin-dark: #5a3a2a;
        --zombie-clothes: #3a2a1a;
        --zombie-eyes: #ff3333;
        --caio-skin: #e8c5a0;
        --caio-hair: #1a1a1a;
        --caio-hoodie: #2d2d2d;
        --caio-hoodie-light: #3a3a3a;
        --caio-pants: #1e1e1e;
        --caio-backpack: #151515;
        --phone-bg: #0a0a0a;
        --phone-text: #00ff88;
        --text-white: #ffffff;
      }
      
      * { margin: 0; padding: 0; box-sizing: border-box; }
      
      #root {
        width: 1080px;
        height: 1920px;
        position: relative;
        background: var(--bg-street);
        overflow: hidden;
      }
      
      .clip { position: absolute; }
      
      /* Sky */
      .sky {
        position: absolute;
        left: 0; top: 0; width: 100%; height: 60%;
        background: linear-gradient(180deg, var(--bg-sky) 0%, var(--bg-street) 100%);
      }
      
      /* Buildings */
      .building {
        position: absolute;
        bottom: 0;
        background: var(--building);
        border-left: 1px solid #1a1a30;
        border-right: 1px solid #1a1a30;
      }
      
      .building-window {
        position: absolute;
        background: var(--window-dark);
        border: 1px solid #050510;
      }
      
      .building-window.lit {
        background: var(--window-lit);
        box-shadow: 0 0 10px #2a2a4a;
      }
      
      /* Street */
      .street {
        position: absolute;
        left: 0; bottom: 0; width: 100%; height: 40%;
        background: linear-gradient(0deg, #0d0d1a 0%, var(--bg-street) 100%);
      }
      
      .street-line {
        position: absolute;
        left: 50%; bottom: 20%; transform: translateX(-50%);
        width: 4px; height: 60px;
        background: repeating-linear-gradient(180deg, #3a3a3a 0, #3a3a3a 20px, transparent 20px, transparent 40px);
        opacity: 0.5;
      }
      
      /* Street lights */
      .street-light-pole {
        position: absolute;
        bottom: 15%;
        width: 6px; height: 200px;
        background: linear-gradient(180deg, #2a2a2a 0%, #1a1a1a 100%);
      }
      
      .street-light-glow {
        position: absolute;
        bottom: 35%; left: 50%; transform: translateX(-50%);
        width: 200px; height: 200px;
        background: radial-gradient(circle, var(--street-light) 0%, transparent 70%);
        opacity: 0.15;
        filter: blur(20px);
      }
      
      /* Supermarket */
      .supermarket {
        position: absolute;
        right: 50px; bottom: 15%;
        width: 500px; height: 600px;
      }
      
      .market-facade {
        position: absolute;
        left: 0; top: 0; width: 100%; height: 100%;
        background: linear-gradient(180deg, #1a1a2a 0%, #151525 100%);
        border-radius: 8px 8px 0 0;
        border: 2px solid #2a2a2a;
      }
      
      .market-windows {
        position: absolute;
        left: 20px; top: 20px; right: 20px; bottom: 150px;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        grid-template-rows: repeat(3, 1fr);
        gap: 15px;
        padding: 10px;
      }
      
      .market-window {
        background: var(--window-dark);
        border: 1px solid #0a0a1a;
        border-radius: 4px;
      }
      
      .market-window.broken {
        background: #0a0a15;
        border-color: #3a1a1a;
      }
      
      .market-entrance {
        position: absolute;
        left: 50%; bottom: 0; transform: translateX(-50%);
        width: 200px; height: 150px;
        background: #0a0a15;
        border: 2px solid #2a2a2a;
        border-bottom: none;
        border-radius: 8px 8px 0 0;
      }
      
      .market-doors {
        position: absolute;
        left: 10px; top: 10px; right: 10px; bottom: 10px;
        display: flex;
      }
      
      .market-door {
        flex: 1;
        background: linear-gradient(180deg, #2a2a2a 0%, #1a1a1a 100%);
        border: 1px solid #3a3a3a;
        border-radius: 2px;
      }
      
      .market-door.closed { transform: translateX(0); }
      .market-door.open { transform: translateX(-100%); }
      
      .market-sign {
        position: absolute;
        left: 50%; top: -60px; transform: translateX(-50%);
        width: 400px; height: 80px;
        background: linear-gradient(180deg, var(--market-sign) 0%, var(--market-sign-dim) 100%);
        border-radius: 10px;
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 0 30px var(--market-sign);
        animation: signFlicker 0.5s infinite alternate;
      }
      
      @keyframes signFlicker {
        0% { opacity: 1; box-shadow: 0 0 30px var(--market-sign); }
        100% { opacity: 0.8; box-shadow: 0 0 15px var(--market-sign); }
      }
      
      .market-sign-text {
        color: white; font-size: 36px; font-weight: bold; letter-spacing: 2px;
        text-shadow: 0 0 10px #ff6666;
      }
      
      /* Zombie */
      .zombie {
        position: absolute;
        left: 50%; bottom: 15%;
        transform: translateX(-50%);
        width: 150px; height: 350px;
        opacity: 0;
      }
      
      .zombie-svg { width: 100%; height: 100%; }
      
      /* Caio */
      .caio-container {
        position: absolute;
        left: 50%; bottom: 50px;
        transform: translateX(-50%);
        width: 200px; height: 450px;
      }
      
      .caio-svg { width: 100%; height: 100%; }
      
      .breathe {
        animation: breathe 3s ease-in-out infinite;
        transform-origin: center bottom;
      }
      
      @keyframes breathe {
        0%, 100% { transform: scaleY(1) translateX(-50%); }
        50% { transform: scaleY(1.02) translateX(-50%); }
      }
      
      /* Phone */
      .phone {
        position: absolute;
        left: 50%; bottom: 200px;
        transform: translateX(-50%);
        width: 80px; height: 140px;
        opacity: 0;
        pointer-events: none;
      }
      
      .phone-body {
        width: 100%; height: 100%;
        background: var(--phone-bg);
        border-radius: 12px;
        border: 2px solid #1a1a1a;
      }
      
      .phone-screen {
        position: absolute;
        left: 4px; top: 4px; right: 4px; bottom: 4px;
        background: #001a05;
        border-radius: 10px;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        padding: 10px;
        font-family: monospace;
        color: var(--phone-text);
        font-size: 11px;
        line-height: 1.4;
        text-align: center;
        overflow: hidden;
      }
      
      .phone-notification {
        position: absolute;
        top: -30px; left: 50%; transform: translateX(-50%);
        width: 200px; height: 40px;
        background: var(--phone-bg);
        border: 2px solid var(--phone-text);
        border-radius: 8px;
        display: flex; align-items: center; justify-content: center;
        color: var(--phone-text);
        font-family: monospace;
        font-size: 10px;
        font-weight: bold;
        opacity: 0;
        animation: notifyPulse 1s infinite;
      }
      
      @keyframes notifyPulse {
        0%, 100% { border-color: var(--phone-text); box-shadow: 0 0 10px var(--phone-text); }
        50% { border-color: #00ffaa; box-shadow: 0 0 20px var(--phone-text); }
      }
      
      /* Hide message */
      .phone-message { display: none; }
      .phone-message.visible { display: block; animation: typewriter 0.5s steps(20) forwards; }
      
      @keyframes typewriter {
        from { width: 0; }
        to { width: 100%; }
      }
    </style>
  </head>

    <script>
      const tl = gsap.timeline({ paused: true });
      
      // Caio walks down street
      tl.to("#caio-body", { x: 200, duration: 4, ease: "power1.inOut" }, 0.5);
      
      // Walk cycle - legs
      tl.to("#caio-leg-left", { rotation: 20, transformOrigin: "center top", duration: 0.3, yoyo: true, repeat: 12, ease: "power1.inOut" }, 0.5);
      tl.to("#caio-leg-right", { rotation: -20, transformOrigin: "center top", duration: 0.3, yoyo: true, repeat: 12, ease: "power1.inOut" }, 0.65);
      tl.to("#caio-arm-left", { rotation: -20, transformOrigin: "50% 0%", duration: 0.3, yoyo: true, repeat: 12, ease: "power1.inOut" }, 0.5);
      tl.to("#caio-arm-right", { rotation: 20, transformOrigin: "50% 0%", duration: 0.3, yoyo: true, repeat: 12, ease: "power1.inOut" }, 0.65);
      
      // Bob up/down
      tl.to("#caio-body", { y: -8, duration: 0.3, yoyo: true, repeat: 25, ease: "power1.inOut" }, 0.5);
      
      // Approaches supermarket
      tl.to("#caio-body", { x: 350, duration: 3, ease: "power1.inOut" }, 5);
      
      // Zombie appears near market
      tl.to("#zombie", { opacity: 1, y: -30, duration: 1, ease: "power2.out" }, 8);
      
      // Caio notices zombie - stops
      tl.to("#caio-body", { x: 300, duration: 1, ease: "power2.out" }, 9);
      tl.to("#caio-leg-left, #caio-leg-right, #caio-arm-left, #caio-arm-right", { rotation: 0, duration: 0.3 }, 9);
      tl.to("#caio-body", { y: 0, duration: 0.3 }, 9);
      
      // Fear reaction
      tl.to("#caio-head", { rotation: -15, transformOrigin: "center center", duration: 0.4, ease: "power2.out" }, 9.2);
      tl.to("#caio-brow-left", { attr: { d: "M15 35 Q35 10 55 35" } }, 9.2);
      tl.to("#caio-brow-right", { attr: { d: "M65 35 Q85 10 105 35" } }, 9.2);
      tl.to("#caio-eye-left ellipse:nth-child(2), #caio-eye-right ellipse:nth-child(2)", 
        { attr: { rx: 14, ry: 16 }, duration: 0.2 }, 9.2);
      tl.to("#caio-mouth-path", { attr: { d: "M-10 0 Q0 18 10 0" } }, 9.2);
      
      // Hide behind cover
      tl.to("#caio-body", { x: 150, y: 20, scale: 0.9, transformOrigin: "center bottom", duration: 1, ease: "power2.out" }, 10);
      
      // Zombie shambles
      tl.to("#zombie-svg", { x: -20, duration: 2, yoyo: true, repeat: 2, ease: "power1.inOut" }, 10);
      
      // Phone notification at 12s
      tl.to("#phone", { opacity: 1, y: -20, duration: 0.5, ease: "back.out(1.7)" }, 12);
      tl.to("#phoneNotif1", { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, 12.2);
      
      // Phone vibrates
      tl.to("#phone", { x: -5, duration: 0.05, repeat: 10, yoyo: true, ease: "rough({strength: 5, points: 20})" }, 12.5);
      
      // Message 1 appears: "NÃO ENTRE NO MERCADO"
      tl.set("#phoneMsg1", { innerHTML: "NÃO ENTRE<br>NO MERCADO", className: "+=visible" }, 13);
      tl.to("#phoneMsg1", { opacity: 1, duration: 0.3 }, 13);
      
      // Caio reads message - confusion
      tl.to("#caio-head", { rotation: 20, transformOrigin: "center center", duration: 0.5, ease: "power2.out" }, 13.5);
      tl.to("#caio-brow-left", { attr: { d: "M15 35 Q35 30 55 35" } }, 13.5);
      tl.to("#caio-brow-right", { attr: { d: "M65 35 Q85 30 105 35" } }, 13.5);
      tl.to("#caio-eye-left ellipse:nth-child(2), #caio-eye-right ellipse:nth-child(2)", 
        { attr: { rx: 13, ry: 15 }, duration: 0.3 }, 13.5);
      tl.to("#caio-mouth-path", { attr: { d: "M-10 0 Q0 12 10 0" } }, 13.5);
      
      // Looks around - who sent this?
      tl.to("#caio-head", { rotation: -20, transformOrigin: "center center", duration: 0.6, ease: "power2.inOut" }, 14.5);
      tl.to("#caio-head", { rotation: 20, transformOrigin: "center center", duration: 0.6, ease: "power2.inOut" }, 15.5);
      tl.to("#caio-head", { rotation: 0, transformOrigin: "center center", duration: 0.5, ease: "power2.out" }, 16.5);
      
      // Phone screen glows
      tl.to("#phoneScreen", { background: "#002a10", duration: 0.5, yoyo: true, repeat: 3 }, 15);
      
      window.__timelines = window.__timelines || {};
      window.__timelines["scene5"] = tl;
      tl.seek(0);
    </script>
